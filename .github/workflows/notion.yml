name: notion

on:
  push:
    branches: [main, master, dev]
    paths:
      - "notion/**"
      - ".github/workflows/notion.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "notion/**"
      - ".github/workflows/notion.yml"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Install tools
        run: pip install black

      - name: Black Check
        run: black --check notion/lambda/handler.py

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: notion/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: notion/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: notion/terraform

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::832242454463:role/github-actions-deploy
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: notion/terraform

      - name: Terraform Apply
        env:
          TF_VAR_notion_token: ${{ secrets.NOTION_TOKEN }}
          TF_VAR_notion_automations_db_id: ${{ secrets.NOTION_AUTOMATIONS_DB_ID }}
        run: terraform apply -auto-approve -input=false -no-color -lock-timeout=60s
        working-directory: notion/terraform
