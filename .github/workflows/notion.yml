name: notion

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'notion/**'
      - '.github/workflows/notion.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'notion/**'
      - '.github/workflows/notion.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tools
        run: pip install black

      - name: Black Check
        run: black --check notion/lambda/handler.py

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: notion/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: notion/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: notion/terraform

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::832242454463:role/github-actions-deploy
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: notion/terraform

      - name: Terraform Apply
        run: >
          terraform apply -auto-approve -input=false -no-color -lock-timeout=60s
          -var="notion_token=${{ secrets.NOTION_TOKEN }}"
          -var="notion_automations_db_id=${{ secrets.NOTION_AUTOMATIONS_DB_ID }}"
        working-directory: notion/terraform
