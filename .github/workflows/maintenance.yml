name: maintenance

on:
  push:
    branches: [main, master, dev]
    paths:
      - "maintenance/**"
      - ".github/workflows/maintenance.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "maintenance/**"
      - ".github/workflows/maintenance.yml"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "20"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Install tools
        run: |
          sudo apt-get update
          npm install -g prettier

      - name: Prettier Check
        run: |
          prettier --config .prettierrc.json --check "maintenance/**/*.js"

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: maintenance/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: maintenance/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: maintenance/terraform

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::832242454463:role/github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: maintenance/terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color -lock-timeout=60s
        working-directory: maintenance/terraform
