name: frontend

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          npm install -g prettier

      - name: Prettier Check
        run: |
          prettier --config .prettierrc.json --check "frontend/**/*.{js,vue,css,html}"

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: frontend/terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: frontend/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: frontend/terraform

      - name: Validate HTML
        run: tidy -qe frontend/src/index.html

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.base_ref == 'master' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::832242454463:role/github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Determine workspace
        id: workspace
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "workspace=main" >> $GITHUB_OUTPUT
          else
            echo "workspace=dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: frontend/terraform

      - name: Select or create workspace
        run: terraform workspace select -or-create ${{ steps.workspace.outputs.workspace }}
        working-directory: frontend/terraform

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=60s
        working-directory: frontend/terraform
