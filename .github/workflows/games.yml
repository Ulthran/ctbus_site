name: games

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'games/**'
      - '.github/workflows/games.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'games/**'
      - '.github/workflows/games.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'games/**'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          npm install -g prettier

      - name: Prettier Check
        run: prettier --config .prettierrc.json --check "games/**/*.{js,html}"

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: games

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: games

      - name: Terraform Validate
        run: terraform validate
        working-directory: games

      - name: Validate HTML
        run: |
          tidy -qe games/src/index.html
          tidy -qe games/src/404.html
          tidy -qe games/src/50x.html

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::832242454463:role/github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: games

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color -lock-timeout=60s
        working-directory: games
